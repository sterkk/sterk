<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>E-posta Doğrulama — Sterk</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#04040d;color:#e2e8f0;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:rgba(10,10,24,0.9);border:1px solid rgba(255,255,255,0.07);border-radius:22px;padding:2.5rem 2rem;max-width:420px;width:90%;text-align:center;}
.icon{font-size:3.5rem;margin-bottom:1rem;}
h1{font-family:'Syne',sans-serif;font-size:1.4rem;margin-bottom:0.6rem;}
p{color:#94a3b8;font-size:0.85rem;line-height:1.6;margin-bottom:1.5rem;}
.btn{display:inline-block;padding:0.65rem 1.8rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;color:white;text-decoration:none;font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">{% if success %}✅{% else %}❌{% endif %}</div>
  <h1>{% if success %}E-posta Doğrulandı!{% else %}Doğrulama Başarısız{% endif %}</h1>
  <p>{{ msg }}</p>
  <a href="/{% if success %}feed{% else %}register{% endif %}" class="btn">{% if success %}Uygulamaya Git →{% else %}Geri Dön{% endif %}</a>
</div>
</body>
</html>
